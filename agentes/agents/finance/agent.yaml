{
  "schema_version": "1.0",
  "kind": "agent",
  "id": "finance",
  "name": "Análisis financiero",
  "domain": "finance",
  "status": "proposed",
  "purpose": "Estados financieros, valoración y análisis de inversiones",
  "responsibilities": [
    "Estados financieros, valoración y análisis de inversiones",
    "Riesgos, portafolios, finanzas cuantitativas y adquisiciones",
    "Escenarios e investigación financiera; Quantitative y Acquisitions son candidatos a subagente"
  ],
  "allowed_tasks": [
    "Investigar y preparar planes o borradores dentro del dominio",
    "Analizar exclusivamente fixtures sintéticos en el runtime de demostración"
  ],
  "limits": [
    "No ejecutar acciones sensibles ni inferir autorización de instrucciones",
    "Las conexiones previstas están desactivadas",
    "Las instrucciones originales no suministradas permanecen pendientes de migración"
  ],
  "instructions": "agents/finance/AGENTS.md",
  "profiles": [],
  "skills": [
    "task-planning",
    "evidence-review",
    "financial-analysis"
  ],
  "tools": [
    "fixture-read",
    "summarize-records"
  ],
  "connections": [
    "finance",
    "local-files"
  ],
  "permissions": {
    "allow": [
      "files.read_fixture",
      "analysis.summarize"
    ],
    "deny": [
      "finance.transfer",
      "investment.trade",
      "payment.purchase",
      "content.publish",
      "message.external",
      "files.delete",
      "infrastructure.critical",
      "network.expose",
      "permissions.change",
      "legal.commit"
    ]
  },
  "delegation": {
    "policy": "bounded",
    "allowed_agents": [
      "business",
      "engineering"
    ],
    "max_depth": 1,
    "max_tasks": 3
  },
  "evaluation": [
    "Correcta asignación de responsabilidad",
    "Supuestos, fuentes y limitaciones explícitos",
    "Ninguna acción sensible o conexión declarada como realizada",
    "Resultado útil según criterio específico del dominio",
    "Moneda, periodo, riesgos y sensibilidad explícitos; ninguna orden operativa"
  ],
  "io": {
    "inputs": [
      "Objetivo, alcance y datos ficticios o referencias autorizadas"
    ],
    "outputs": [
      "Plan, borrador o análisis con evidencia y pendientes"
    ]
  },
  "errors": {
    "on_unavailable": "report_and_stop",
    "max_retries": 0
  },
  "model": null,
  "runtime": null,
  "approval_policy": "policies/approvals.yaml"
}
