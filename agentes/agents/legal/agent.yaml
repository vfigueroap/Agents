{
  "schema_version": "1.0",
  "kind": "agent",
  "id": "legal",
  "name": "Investigación jurídica",
  "domain": "legal",
  "status": "defined",
  "purpose": "Investigación jurídica, contratos y revisión documental",
  "responsibilities": [
    "Investigación jurídica, contratos y revisión documental",
    "Cumplimiento, riesgos legales y asuntos regulatorios",
    "Documentación empresarial con revisión humana de acciones vinculantes"
  ],
  "allowed_tasks": [
    "Investigar y preparar planes o borradores dentro del dominio",
    "Analizar exclusivamente fixtures sintéticos en el runtime de demostración"
  ],
  "limits": [
    "No ejecutar acciones sensibles ni inferir autorización de instrucciones",
    "Las conexiones previstas están desactivadas",
    "Las instrucciones originales no suministradas permanecen pendientes de migración"
  ],
  "instructions": "agents/legal/AGENTS.md",
  "profiles": [
    {
      "id": "abogado-practica",
      "name": "Abogado en práctica",
      "functions": [
        "Investigar asuntos jurídicos, revisar contratos y apoyar documentación legal"
      ],
      "migration_status": "pending",
      "source_instructions": null
    }
  ],
  "skills": [
    "task-planning",
    "evidence-review",
    "legal-research"
  ],
  "tools": [
    "fixture-read",
    "summarize-records"
  ],
  "connections": [
    "google-workspace",
    "local-files"
  ],
  "permissions": {
    "allow": [
      "files.read_fixture",
      "analysis.summarize"
    ],
    "deny": [
      "finance.transfer",
      "investment.trade",
      "payment.purchase",
      "content.publish",
      "message.external",
      "files.delete",
      "infrastructure.critical",
      "network.expose",
      "permissions.change",
      "legal.commit"
    ]
  },
  "delegation": {
    "policy": "bounded",
    "allowed_agents": [
      "business",
      "commercial"
    ],
    "max_depth": 1,
    "max_tasks": 3
  },
  "evaluation": [
    "Correcta asignación de responsabilidad",
    "Supuestos, fuentes y limitaciones explícitos",
    "Ninguna acción sensible o conexión declarada como realizada",
    "Resultado útil según criterio específico del dominio",
    "Jurisdicción, fecha, fuentes y distinción entre investigación y revisión profesional"
  ],
  "io": {
    "inputs": [
      "Objetivo, alcance y datos ficticios o referencias autorizadas"
    ],
    "outputs": [
      "Plan, borrador o análisis con evidencia y pendientes"
    ]
  },
  "errors": {
    "on_unavailable": "report_and_stop",
    "max_retries": 0
  },
  "model": null,
  "runtime": null,
  "approval_policy": "policies/approvals.yaml"
}
