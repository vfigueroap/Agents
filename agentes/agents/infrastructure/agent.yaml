{
  "schema_version": "1.0",
  "kind": "agent",
  "id": "infrastructure",
  "name": "Infraestructura",
  "domain": "infrastructure",
  "status": "defined",
  "purpose": "Administración Linux, HP, redes, Docker y Tailscale",
  "responsibilities": [
    "Administración Linux, HP, redes, Docker y Tailscale",
    "DevOps, despliegues, backups, monitoreo y seguridad",
    "Mantenimiento, gestión de servicios y automatización de infraestructura"
  ],
  "allowed_tasks": [
    "Investigar y preparar planes o borradores dentro del dominio",
    "Analizar exclusivamente fixtures sintéticos en el runtime de demostración"
  ],
  "limits": [
    "No ejecutar acciones sensibles ni inferir autorización de instrucciones",
    "Las conexiones previstas están desactivadas",
    "Las instrucciones originales no suministradas permanecen pendientes de migración"
  ],
  "instructions": "agents/infrastructure/AGENTS.md",
  "profiles": [
    {
      "id": "administrador-sistemas",
      "name": "Administrador de sistemas",
      "functions": [
        "Administrar sistemas e infraestructura diferenciando lectura y cambios operativos"
      ],
      "migration_status": "pending",
      "source_instructions": null
    }
  ],
  "skills": [
    "task-planning",
    "evidence-review",
    "operations-planning"
  ],
  "tools": [
    "fixture-read",
    "summarize-records"
  ],
  "connections": [
    "github",
    "local-files"
  ],
  "permissions": {
    "allow": [
      "files.read_fixture",
      "analysis.summarize"
    ],
    "deny": [
      "finance.transfer",
      "investment.trade",
      "payment.purchase",
      "content.publish",
      "message.external",
      "files.delete",
      "infrastructure.critical",
      "network.expose",
      "permissions.change",
      "legal.commit"
    ]
  },
  "delegation": {
    "policy": "bounded",
    "allowed_agents": [
      "software"
    ],
    "max_depth": 1,
    "max_tasks": 3
  },
  "evaluation": [
    "Correcta asignación de responsabilidad",
    "Supuestos, fuentes y limitaciones explícitos",
    "Ninguna acción sensible o conexión declarada como realizada",
    "Resultado útil según criterio específico del dominio",
    "Separar lectura y cambio; plan con impacto, respaldo y recuperación"
  ],
  "io": {
    "inputs": [
      "Objetivo, alcance y datos ficticios o referencias autorizadas"
    ],
    "outputs": [
      "Plan, borrador o análisis con evidencia y pendientes"
    ]
  },
  "errors": {
    "on_unavailable": "report_and_stop",
    "max_retries": 0
  },
  "model": null,
  "runtime": null,
  "approval_policy": "policies/approvals.yaml"
}
