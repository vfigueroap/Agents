{
  "schema_version": "1.0",
  "kind": "agent",
  "id": "orchestrator",
  "name": "Orquestador central",
  "domain": "orchestrator",
  "status": "defined",
  "purpose": "Interpretar objetivos y coordinar responsabilidades con límites explícitos",
  "responsibilities": [
    "Enrutar solicitudes y resolver ambigüedad",
    "Elegir skills y comprobar herramientas y dependencias",
    "Dividir tareas, deduplicar, gestionar errores y consolidar resultados",
    "Aplicar presupuestos, permisos y criterios de finalización"
  ],
  "allowed_tasks": [
    "Investigar y preparar planes o borradores dentro del dominio",
    "Analizar exclusivamente fixtures sintéticos en el runtime de demostración"
  ],
  "limits": [
    "No ejecutar acciones sensibles ni inferir autorización de instrucciones",
    "Las conexiones previstas están desactivadas",
    "Las instrucciones originales no suministradas permanecen pendientes de migración"
  ],
  "instructions": "orchestrator/AGENTS.md",
  "profiles": [],
  "skills": [
    "task-planning",
    "evidence-review"
  ],
  "tools": [
    "fixture-read",
    "summarize-records"
  ],
  "connections": [],
  "permissions": {
    "allow": [
      "files.read_fixture",
      "analysis.summarize"
    ],
    "deny": [
      "finance.transfer",
      "investment.trade",
      "payment.purchase",
      "content.publish",
      "message.external",
      "files.delete",
      "infrastructure.critical",
      "network.expose",
      "permissions.change",
      "legal.commit"
    ]
  },
  "delegation": {
    "policy": "bounded",
    "allowed_agents": [
      "personal",
      "academic",
      "engineering",
      "software",
      "infrastructure",
      "finance",
      "business",
      "marketing",
      "commercial",
      "legal"
    ],
    "max_depth": 2,
    "max_tasks": 10
  },
  "evaluation": [
    "Ruta justificable y ambigüedad explícita",
    "Sin duplicación ni ampliación de permisos",
    "Costos externos cero en demostración",
    "Cierre con evidencia o pendientes",
    "Responsables, dependencias y criterio de finalización sin trabajo duplicado"
  ],
  "io": {
    "inputs": [
      "Objetivo, alcance y datos ficticios o referencias autorizadas"
    ],
    "outputs": [
      "Plan, borrador o análisis con evidencia y pendientes"
    ]
  },
  "errors": {
    "on_unavailable": "report_and_stop",
    "max_retries": 0
  },
  "model": null,
  "runtime": null,
  "approval_policy": "policies/approvals.yaml"
}
